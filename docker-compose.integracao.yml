# Liga o Backend Core aos layers REAIS rodando no host:
#   DB Layer  :3002  (pedrolombardi/db-layer: docker compose up)
#   AI Layer  :3001  (pedrolombardi/placeholder-ai-layer: npm run dev, com DB_LAYER_URL=http://localhost:3002)
# O Data Layer continua no mock.
#
#   docker compose -f docker-compose.yml -f docker-compose.integracao.yml up --build
services:
  backend:
    environment:
      DB_LAYER_URL: http://host.docker.internal:3002
      AI_LAYER_URL: http://host.docker.internal:3001
      HTTP_TIMEOUT_MS: 10000
    extra_hosts:
      - "host.docker.internal:host-gateway"
